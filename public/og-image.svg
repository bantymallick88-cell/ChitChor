<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#0d1424"/>
      <stop offset="100%" stop-color="#070a10"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="25" y="25" width="1150" height="580" rx="24" fill="none" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="2"/>
  
  <!-- Subtle decorative stars -->
  <circle cx="150" cy="120" r="2" fill="#f59e0b" opacity="0.6"/>
  <circle cx="1050" cy="180" r="2" fill="#f59e0b" opacity="0.6"/>
  <circle cx="200" cy="500" r="2.5" fill="#34d399" opacity="0.5"/>
  <circle cx="1000" cy="480" r="2.5" fill="#f59e0b" opacity="0.5"/>

  <!-- Center Crown Insignia -->
  <g transform="translate(600, 150) scale(1.2)">
    <circle cx="0" cy="0" r="60" fill="#f59e0b" fill-opacity="0.15" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="50" fill="#111827" stroke="url(#gold)" stroke-width="3"/>
    <!-- Crown -->
    <path d="M-24 12 L-20 -12 L-6 -2 L0 -18 L6 -2 L20 -12 L24 12 Z" fill="url(#gold)"/>
    <circle cx="0" cy="14" r="3" fill="#fff"/>
  </g>

  <!-- Title -->
  <text x="600" y="295" font-family="'Cinzel', Georgia, serif" font-size="64" font-weight="900" fill="url(#gold)" text-anchor="middle" letter-spacing="4">CHITCHOR</text>
  
  <!-- Hindi Subtitle -->
  <text x="600" y="345" font-family="'Outfit', sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="0.95">राजा रानी चोर सिपाही • Play Online Free</text>

  <!-- Tagline -->
  <text x="600" y="390" font-family="'Outfit', sans-serif" font-size="20" fill="#94a3b8" text-anchor="middle">The Modern Royal 3D Paper Chit Game • 4 &amp; 5 Players • Pass &amp; Play &amp; Online Rooms</text>

  <!-- 4 Badges on preview card -->
  <g transform="translate(600, 460)">
    <!-- Raja -->
    <g transform="translate(-250, 0)">
      <rect x="-60" y="-22" width="120" height="44" rx="12" fill="#78350f" fill-opacity="0.6" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="0" y="6" font-family="'Outfit', sans-serif" font-size="14" font-weight="bold" fill="#fef08a" text-anchor="middle">👑 RAJA 1000</text>
    </g>
    <!-- Rani -->
    <g transform="translate(-80, 0)">
      <rect x="-60" y="-22" width="120" height="44" rx="12" fill="#831843" fill-opacity="0.6" stroke="#f43f5e" stroke-width="1.5"/>
      <text x="0" y="6" font-family="'Outfit', sans-serif" font-size="14" font-weight="bold" fill="#fbcfe8" text-anchor="middle">💎 RANI 500</text>
    </g>
    <!-- Sipahi -->
    <g transform="translate(85, 0)">
      <rect x="-60" y="-22" width="120" height="44" rx="12" fill="#155e75" fill-opacity="0.6" stroke="#06b6d4" stroke-width="1.5"/>
      <text x="0" y="6" font-family="'Outfit', sans-serif" font-size="14" font-weight="bold" fill="#cffafe" text-anchor="middle">⚔️ SIPAHI 100</text>
    </g>
    <!-- Chor -->
    <g transform="translate(255, 0)">
      <rect x="-60" y="-22" width="120" height="44" rx="12" fill="#7f1d1d" fill-opacity="0.6" stroke="#ef4444" stroke-width="1.5"/>
      <text x="0" y="6" font-family="'Outfit', sans-serif" font-size="14" font-weight="bold" fill="#fecaca" text-anchor="middle">🎭 CHOR 0</text>
    </g>
  </g>

  <!-- Domain link badge at bottom -->
  <g transform="translate(600, 545)">
    <rect x="-160" y="-18" width="320" height="36" rx="18" fill="url(#emerald)"/>
    <text x="0" y="5" font-family="'Outfit', sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">chitchor.fixeehub.com</text>
  </g>
</svg>
